name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install collection dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile first-party Python
        run: python -m py_compile *.py
      - name: Check shell syntax
        run: bash -n run-scrapers.sh
      - name: Validate shared schema and configuration
        run: python selfcheck_schema.py
      - name: Validate X retry behavior
        run: python selfcheck_twtr_retry.py
      - name: Run synthetic pipeline demo
        run: python demo.py > /tmp/social-scraping-demo.json
