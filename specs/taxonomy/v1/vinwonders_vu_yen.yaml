attention_topics:
  - Vé/QR bị từ chối hoặc báo đã sử dụng; soát vé chậm; không suy nguyên nhân lỗi hệ thống khi chưa rõ.
  - Hàng chờ cổng vào/cổng ra, bãi xe và đường tiếp cận; hàng chờ trò chơi/quầy dịch vụ phân loại riêng.
  - App mua vé/thanh toán, hỗ trợ đổi vé và hoàn tiền.
  - Đại lý/người bán vé độc lập khác đơn vị vận hành công viên; không quy trách nhiệm theo group name.
  - Group bán vé vẫn có complaint thật; parent quảng cáo không chặn child complaint.
scope_review_topics:
  - Vũ Yên/Royal Island riêng lẻ không đủ khẳng định công viên; giữ project unresolved hoặc conflict.
  - Chất lượng tiện ích, vệ sinh, giá thu sai và dịch vụ chưa có nhãn chi tiết dùng OTHER_CUSTOMER_COMPLAINT nếu evidence rõ.
  - An toàn trò chơi/sự cố sức khỏe là đề xuất mở rộng; giữ REVIEW/OTHER_RELEVANT và không kết luận nguyên nhân hay hướng dẫn y tế.
  - Hàng chờ trò chơi có thể SERVICE_DELAY, không ENTRY_QUEUE nếu không phải cổng vào dự án.
