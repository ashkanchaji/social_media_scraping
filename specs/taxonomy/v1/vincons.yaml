attention_topics:
  - Phân biệt công trường cụ thể với tên doanh nghiệp VinCons; thiếu địa điểm phải giữ null.
  - Thời điểm vào ca/tan ca, chiều di chuyển, loại người/xe chỉ trích khi có evidence.
  - Lỗi thẻ/QR/khuôn mặt/barrier, quy trình đăng ký và ngoại lệ ra vào.
  - Phản ánh nhân sự kiểm soát không tự là phản ánh khách hàng; lưu role UNKNOWN nếu chưa rõ.
  - Nhà thầu/bộ phận/bên bị phản ánh chỉ ghi theo lời người viết, chưa là kết luận trách nhiệm.
scope_review_topics:
  - Tranh chấp lương, nợ lương, điều kiện lao động và chỗ ở không tự map CUSTOMER_COMPLAINT; REVIEW/OTHER_RELEVANT chờ mentor duyệt phạm vi.
  - Sự cố an toàn có tín hiệu cụ thể giữ REVIEW/OTHER_RELEVANT, không loại theo từ khóa vay nợ/tuyển dụng.
  - Tin hoàn tiền dịch vụ ngoài nhóm đã bật cần review, không DROP chỉ vì REFUND_DISPUTE chưa bật.
